name: Main CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Full Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff Check
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest

      - name: FastAPI Import Check
        run: |
          uv run python -c \
            "from app.main import app; print('FastAPI app loaded:', app.title)"

