<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsightCopilot · 买家消息处理联调台</title>
  <style>
    :root {
      --bg: #f5f7fa; --panel: #fff; --line: #e3e8ef; --primary: #2f6bff;
      --text: #1f2533; --muted: #8a94a6; --ok: #1faa59; --warn: #d97706; --err: #dc2626;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           background: var(--bg); color: var(--text); }
    .layout { display: flex; min-height: 100vh; }
    /* 侧边栏 */
    .sidebar { width: 240px; background: var(--panel); border-right: 1px solid var(--line);
               padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar h2 { font-size: 14px; color: var(--muted); margin: 14px 0 6px; letter-spacing: .5px; }
    .sidebar h2:first-child { margin-top: 0; }
    .btn { border: 1px solid var(--line); background: #fafbfc; color: var(--text);
           padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left;
           transition: .15s; }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    /* 主区 */
    .main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
                      font-size: 13px; font-family: inherit; }
    input { width: 200px; }
    .status { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #eef1f6; color: var(--muted); }
    .status.on { background: #e7f6ee; color: var(--ok); }
    .status.off { background: #fdeaea; color: var(--err); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .card h3 { margin: 0 0 10px; font-size: 14px; }
    .draft { white-space: pre-wrap; line-height: 1.7; font-size: 14px; min-height: 60px;
             border: 1px dashed var(--line); border-radius: 8px; padding: 12px; background: #fcfdff; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .log { height: 180px; overflow: auto; font-family: ui-monospace, Menlo, Consolas, monospace;
           font-size: 12px; background: #0f1626; color: #c8d3e6; padding: 10px; border-radius: 8px; }
    .log .e { color: #ff9b9b; } .log .i { color: #9fd0ff; }
    #buyerMsg { width: 360px; }
    .row { display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 侧边栏：功能按钮 -->
    <aside class="sidebar">
      <h2>草稿改写</h2>
      <button class="btn" data-cmd="adjust_tone" data-tone="polite">🙇 礼貌润色</button>
      <button class="btn" data-cmd="adjust_tone" data-tone="empathetic">💗 共情润色</button>
      <button class="btn" data-cmd="adjust_tone" data-tone="concise">⚡ 简洁润色</button>
      <button class="btn" data-cmd="adjust_tone" data-tone="warm">🌞 亲切润色</button>
      <button class="btn" data-cmd="optimize_expression">✨ 优化表达</button>
      <h2>连接</h2>
      <button class="btn primary" id="connectBtn">连接 WebSocket</button>
    </aside>

    <!-- 主区 -->
    <main class="main">
      <div class="bar">
        <label>后端地址</label>
        <input id="baseUrl" value="ws://127.0.0.1:8000" />
        <label>会话 ID</label>
        <input id="sessionId" value="S-TEST" />
        <span id="status" class="status off">未连接</span>
      </div>

      <div class="card">
        <h3>① 模拟买家消息（POST /api/test/buyer_message）</h3>
        <div class="row">
          <input id="buyerMsg" placeholder="输入买家发来的消息，如：退款怎么还没到账？" />
          <button class="btn primary" id="sendBuyerBtn">发送并分析</button>
        </div>
        <div class="meta">该接口会触发一次副驾分析，并通过 WebSocket 把结果实时推送到本页面。</div>
      </div>

      <div class="card">
        <h3>② 当前草稿（服务端返回，可点左侧按钮改写）</h3>
        <div class="draft" id="draft">（暂无草稿，先发送一条买家消息）</div>
        <div class="meta" id="draftMeta"></div>
      </div>

      <div class="card">
        <h3>③ 分析洞察（来自广播）</h3>
        <div class="draft" id="insight" style="min-height:40px;font-size:13px;">（等待广播…）</div>
      </div>

      <div class="card">
        <h3>通信日志</h3>
        <div class="log" id="log"></div>
      </div>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let ws = null;
    let currentDraft = "";

    function log(msg, kind = "") {
      const el = $("log");
      const line = document.createElement("div");
      if (kind) line.className = kind;
      const t = new Date().toLocaleTimeString();
      line.textContent = `[${t}] ${msg}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function setStatus(on) {
      const s = $("status");
      s.textContent = on ? "已连接" : "未连接";
      s.className = "status " + (on ? "on" : "off");
    }

    function wsBase() {
      // 把 ws://host 同时支持 http 兜底
      const v = $("baseUrl").value.trim().replace(/\/+$/, "");
      return v;
    }

    function connect() {
      if (ws) { try { ws.close(); } catch (e) {} }
      const url = `${wsBase()}/ws/${encodeURIComponent($("sessionId").value.trim())}`;
      log("连接 " + url, "i");
      ws = new WebSocket(url);
      ws.onopen = () => { setStatus(true); log("WebSocket 已打开"); };
      ws.onclose = () => { setStatus(false); log("WebSocket 已关闭"); };
      ws.onerror = (e) => { setStatus(false); log("WebSocket 错误", "e"); };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { log("收到非 JSON: " + ev.data, "e"); return; }
        handleServer(msg);
      };
    }

    function handleServer(msg) {
      if (msg.type === "rewrite") {
        currentDraft = msg.rewritten;
        $("draft").textContent = currentDraft;
        $("draftMeta").textContent = `指令=${msg.command} | 路由=${msg.model_route} | 降级=${msg.degraded}`;
        log(`改写回写(${msg.command}): ${msg.rewritten}`);
      } else if (msg.type === "analysis") {
        const r = msg.result || {};
        const ins = r.insight || {};
        currentDraft = r.draft_reply || currentDraft;
        $("draft").textContent = currentDraft || "（分析未产出草稿）";
        $("draftMeta").textContent = `会话=${msg.session_id} | 风险=${ins.risk_level || "-"} | 情绪=${ins.emotion || "-"}`;
        $("insight").textContent =
          `意图: ${ins.intent_primary || "-"} / ${ins.intent_secondary || "-"}\n` +
          `情绪: ${ins.emotion || "-"} (${ins.emotion_trend || "-"})  风险: ${ins.risk_level || "-"}\n` +
          `证据: ${(ins.evidence || []).map(e => e.quote).filter(Boolean).join("；") || "无"}`;
        log(`广播分析到达 session=${msg.session_id}`);
      } else if (msg.type === "error") {
        log(`服务端错误 [${msg.code}]: ${msg.message}`, "e");
      } else {
        log("未知消息类型: " + JSON.stringify(msg));
      }
    }

    function sendCommand(cmd, tone) {
      if (!ws || ws.readyState !== WebSocket.OPEN) { log("请先连接 WebSocket", "e"); return; }
      if (!currentDraft) { log("暂无可改写的草稿", "e"); return; }
      const payload = { command: cmd, params: {}, draft: currentDraft };
      if (tone) payload.params.tone = tone;
      ws.send(JSON.stringify(payload));
      log(`发送指令: ${cmd}${tone ? " tone=" + tone : ""}`);
    }

    // 侧边栏按钮
    document.querySelectorAll(".btn[data-cmd]").forEach((b) => {
      b.addEventListener("click", () => sendCommand(b.dataset.cmd, b.dataset.tone));
    });
    $("connectBtn").addEventListener("click", connect);

    // 模拟买家消息
    $("sendBuyerBtn").addEventListener("click", async () => {
      const msg = $("buyerMsg").value.trim();
      if (!msg) { log("请先输入买家消息", "e"); return; }
      const httpBase = wsBase().replace(/^ws/, "http");
      const url = `${httpBase}/api/test/buyer_message`;
      log("POST " + url, "i");
      try {
        const resp = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: $("sessionId").value.trim(), message: msg }),
        });
        const data = await resp.json();
        log("测试接口返回 session=" + data.session_id);
        // 若已连 WS，结果会通过广播到达；这里也直接渲染一份兜底
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          const r = data.result || {};
          currentDraft = r.draft_reply || currentDraft;
          $("draft").textContent = currentDraft || "（无草稿）";
          $("draftMeta").textContent = "（REST 兜底渲染，未连 WS）";
        }
      } catch (e) {
        log("请求失败: " + e.message, "e");
      }
    });

    log("就绪。先点「连接 WebSocket」，再发一条买家消息。");
  </script>
</body>
</html>
