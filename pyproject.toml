[project]
name = "zhiv-customer-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# 现有 models.py 使用旧式 Column 声明，使用侧被推断为 Column[str] 而非 str，
# 会产生大量与运行行为无关的类型噪声（arg-type/assignment/index 等）。
# 解方思路：后续把 models.py 迁移为 SQLAlchemy 2.0 Mapped 标注后，可移除本项。
disable_error_code = ["arg-type", "assignment", "index", "var-annotated", "call-overload"]